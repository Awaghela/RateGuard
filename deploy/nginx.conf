worker_processes auto;
events { worker_connections 4096; }

http {
  access_log off;

  upstream rateguard {
    server rateguard-1:8080;
    server rateguard-2:8080;
    keepalive 256;
  }

  server {
    listen 80;

    # Live dashboard: static page, served from ./deploy/dashboard (mounted read-only).
    location = /dashboard { return 302 /dashboard/; }
    location /dashboard/ {
      alias /usr/share/nginx/html/dashboard/;
      index index.html;
      add_header Cache-Control "no-store";
    }

    # Read-only window onto Prometheus' query API, so the dashboard can chart
    # metrics from the same origin (no CORS). Only /api/v1/ is exposed, GET only.
    location /prom/api/v1/ {
      limit_except GET HEAD { deny all; }
      proxy_pass http://prometheus:9090/api/v1/;
      proxy_http_version 1.1;
    }

    location / {
      proxy_pass http://rateguard;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
